aid: tasklet-2
name: Tasklet
description: >-
  Tasklet is a cloud AI agent operating system for knowledge work. Teams describe
  tasks in plain English and Tasklet builds autonomous agents that connect to
  thousands of apps, any HTTP API, or MCP servers, then take real actions on their
  behalf — pulling reports, updating CRMs, triaging email, processing data, running
  browser automation, executing code, and generating custom apps. Agents run in the
  cloud 24/7 on schedules or event triggers so they can own ongoing workflows.
  Founded in 2025 by Andrew Lee and Jonny Dimond (ex-Firebase / Shortwave), Tasklet
  is a Y Combinator company (S26) that has raised $20M from Union Square Ventures,
  Lightspeed, Jeff Dean, and the Collison brothers. Tasklet is a consumer of APIs
  and MCP servers rather than a public developer-API provider; it exposes no
  OpenAPI, SDKs, or REST reference of its own.
